# art.gorelikov.ae — статика арт-сайта на Beget (159.194.227.211).
# Отдельный vhost. Не трогает gorelikov.ae / www.gorelikov.ae / /var/www/gorelikov.ae.
# Placeholders __SSL_CERT__ / __SSL_KEY__ подставляет deploy/install.sh

server {
    listen 443 ssl http2;
    server_name art.gorelikov.ae;

    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/art.gorelikov.ae;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /.well-known/acme-challenge/ {
        allow all;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(css|js|png|svg|ico|webmanifest|woff2)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name art.gorelikov.ae;
    location /.well-known/acme-challenge/ {
        root /var/www/art.gorelikov.ae;
    }
    location / {
        return 301 https://art.gorelikov.ae$request_uri;
    }
}
