# gorelikov.ae — статика Расписалки
# Отдельный vhost рядом с Palma / QuestQuest. Не трогает 10000pasos.es.
# Placeholders __SSL_CERT__ / __SSL_KEY__ подставляет deploy/install.sh

server {
    listen 443 ssl http2;
    server_name gorelikov.ae www.gorelikov.ae;

    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/gorelikov.ae;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location ~* \.(css|js|png|svg|webmanifest)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /s/ {
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 80k;
        proxy_read_timeout 20s;
        proxy_connect_timeout 3s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name gorelikov.ae www.gorelikov.ae;
    return 301 https://$host$request_uri;
}
