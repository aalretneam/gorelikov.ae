name: Deploy to Beget

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: creds
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "GitHub → Beget не настроен (нет VPS_SSH_KEY / VPS_HOST / VPS_USER)."
            echo "VPS_HOST должен быть 159.194.227.211 (Beget), не Vultr 208.76.221.48."
            echo "Вручную: ssh root@159.194.227.211 && git -C /opt/gorelikov.ae pull origin main && bash /opt/gorelikov.ae/deploy/install.sh"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Beget
        if: steps.creds.outputs.ready == 'yes'
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_PORT: "22"
          SOURCE: "./"
          TARGET: "/opt/gorelikov.ae/"
          EXCLUDE: "/.git, /.github, /.DS_Store, /raspisanie-editor.html"
          SCRIPT_BEFORE: mkdir -p /opt/gorelikov.ae /var/www/gorelikov.ae
          SCRIPT_AFTER: bash /opt/gorelikov.ae/deploy/install.sh
