name: Deploy to Beget

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-beget
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: creds
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS_SSH_KEY нет — GitHub не пушит на Beget. Сайт сам подтянет main таймером raspisalka-deploy (раз в минуту)."
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Beget
        if: steps.creds.outputs.ready == 'yes'
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: "159.194.227.211"
          REMOTE_USER: "root"
          REMOTE_PORT: "22"
          SOURCE: "./"
          TARGET: "/opt/gorelikov.ae/"
          EXCLUDE: "/.git, /.github, /.DS_Store, /raspisanie-editor.html"
          SCRIPT_BEFORE: mkdir -p /opt/gorelikov.ae /var/www/gorelikov.ae
          SCRIPT_AFTER: bash /opt/gorelikov.ae/deploy/install.sh
