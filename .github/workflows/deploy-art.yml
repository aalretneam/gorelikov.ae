name: Deploy art.gorelikov.ae

on:
  push:
    branches: [artgorelikov]
  workflow_dispatch:

concurrency:
  group: deploy-art-gorelikov
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check deploy secrets
        id: creds
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS_SSH_KEY нет — выложи вручную: rsync в /opt/art.gorelikov.ae и bash deploy/install.sh"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish art site to Beget
        if: steps.creds.outputs.ready == 'yes'
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: "159.194.227.211"
          REMOTE_USER: "root"
          REMOTE_PORT: "22"
          SOURCE: "./"
          TARGET: "/opt/art.gorelikov.ae/"
          EXCLUDE: "/.git, /.github, /.DS_Store, /node_modules"
          SCRIPT_BEFORE: mkdir -p /opt/art.gorelikov.ae /var/www/art.gorelikov.ae
          SCRIPT_AFTER: bash /opt/art.gorelikov.ae/deploy/install.sh
